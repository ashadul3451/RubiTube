<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RubiTube Profile</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="profile-page">
<div class="profile-banner"></div>
  
<h1 id="userEmail">👤 Loading...</h1>

<img id="profilePic"
src="https://via.placeholder.com/120"
width="120"
height="120"
style="border-radius:50%;">

<br><br>

<input type="file" id="imageInput" accept="image/*">

<h3 id="username">
  @rubitube <span class="verified">✔️</span>
</h3>

<div class="stats">
  <div><b>3</b><br>Videos</div>
  <div><b>0</b><br>Followers</div>
  <div><b>0</b><br>Following</div>
</div>

<button onclick="editProfile()">Edit Profile</button>
<button id="logoutBtn">Logout</button>
<h2>My Videos</h2>

<div class="video-grid">
  <video src="video.mp4" controls></video>
  <video src="video2.mp4" controls></video>
  <video src="video3.mp4" controls></video>
</div>
</div>
  
<script>
const imageInput = document.getElementById("imageInput");
const profilePic = document.getElementById("profilePic");

imageInput.addEventListener("change", function() {
  const file = this.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(e){
      profilePic.src = e.target.result;
    };

    reader.readAsDataURL(file);
  }
});
function editProfile() {
  let newName = prompt("Enter new username:");

  if(newName && newName.trim() !== "") {
    document.getElementById("username").innerText = "@" + newName;
  }
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("userEmail");
  alert("Logged Out!");
  window.location.href = "login.html";
});

const savedEmail = localStorage.getItem("userEmail");

if(savedEmail){
  document.getElementById("userEmail").innerText = "👤 " + savedEmail;
}

</script>
  
</body>
</html>
